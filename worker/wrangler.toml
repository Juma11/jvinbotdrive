name = "jvin-brain"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
PROVIDER = "gemini"          # or "claude"
MODEL = "gemini-2.5-flash"   # for claude use e.g. "claude-haiku-5-5"
ROBOT_NAME = "VinBot"
OWNER_NAME = "Vincent"

# Secrets, set once from this folder:
#   npx wrangler secret put ROBOT_TOKEN
#   npx wrangler secret put GEMINI_API_KEY      (or ANTHROPIC_API_KEY)
