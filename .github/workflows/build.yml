name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/JVinDrive.apk
          cp firmware/JVinBot_v3/JVinBot_v3.ino out/JVinBot_v3.ino

      # Fixed links:
      # https://github.com/<owner>/<repo>/releases/download/latest/JVinDrive.apk
      # https://github.com/<owner>/<repo>/releases/download/latest/JVinBot_v3.ino
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* \
            --title "Build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}" \
            --latest

  # Checks the car firmware compiles for ESP32 core 3.x. A failure here does not block the app release.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/JVinBot_v3
